name: CI

on:
  push:

# go-toolchain@v1 requirements. contents: write is the dependency-graph
# submission (403 without it); actions/checks read feed its no-all-builds
# guard; deployments + artifact-metadata are the GitHub Deployment and
# storage record its buildhost autorelease posts as part of publishing.
# All are hard failures, and a job-level block REPLACES this one.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/go-toolchain@v1
        env:
          CGO_ENABLED: "0"

      # go-toolchain@v1 already hands off its build/ outputs through the org
      # cache transport on every run, so nothing extra is uploaded here. The
      # GitHub artifact this used to upload reported success and then could not
      # be downloaded -- the org's Actions artifact storage is exhausted, which
      # is why every repo here moved to the cache hand-off.

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cache-download reads this run's hand-off listing.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Nameless: go-toolchain deprecated the bare `go-build` hand-off name in
      # favour of self-discovery, and asking for it by name matched a PREVIOUS
      # run's entry (cache-xfer-<older run id>-go-build-1) whose build/ did not
      # hold this binary. Discovery is scoped to this run's key prefix.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          path: build

      - name: Show what was restored
        run: ls -la build/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        run: |
          chmod +x build/frontend
          docker build -t docker-frontend:smoke .

      - name: Smoke test frontend
        run: |
          printf '%s\n' '# syntax=docker-frontend:smoke' 'FROM debian:bookworm-slim' 'APT install curl' 'RUN curl --version' > Dockerfile.smoke
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.smoke --no-cache .

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
