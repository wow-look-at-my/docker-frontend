name: CI

on:
  push:

# go-toolchain@v1 requirements. contents: write is the dependency-graph
# submission (403 without it); actions/checks read feed its no-all-builds
# guard; deployments + artifact-metadata are the GitHub Deployment and
# storage record its buildhost autorelease posts as part of publishing.
# All are hard failures, and a job-level block REPLACES this one.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/go-toolchain@v1
        env:
          CGO_ENABLED: "0"

      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: build/frontend

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        run: |
          chmod +x build/frontend
          docker build -t docker-frontend:smoke .

      - name: Smoke test frontend
        run: |
          printf '%s\n' '# syntax=docker-frontend:smoke' 'FROM debian:bookworm-slim' 'APT install curl' 'RUN curl --version' > Dockerfile.smoke
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.smoke --no-cache .

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
