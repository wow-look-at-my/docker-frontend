name: CI

on:
  push:

# go-toolchain@v1 needs all six; each is a hard failure, not a warning.
# A job-level permissions block REPLACES this one -- see docs/ci.md.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/go-toolchain@v1
        env:
          CGO_ENABLED: "0"

      # No artifact upload: go-toolchain hands build/ to later jobs through the
      # org cache transport, and Actions artifact storage is out of quota.

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cache-download reads this run's hand-off listing.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Two hand-offs are saved per run, so nameless discovery won't choose.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build-and-test
          path: build

      # Artifacts are <binary>_<os>_<arch>; the Dockerfile COPYs a bare name.
      - name: Name the binary for the Dockerfile
        run: mv build/frontend_linux_amd64 build/frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        run: docker build -t docker-frontend:smoke .

      - name: Smoke test frontend
        run: |
          printf '%s\n' '# syntax=docker-frontend:smoke' 'FROM debian:bookworm-slim' 'APT install curl' 'RUN curl --version' > Dockerfile.smoke
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.smoke --no-cache .

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
