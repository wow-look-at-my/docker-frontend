name: CI

on:
  push:

# go-toolchain@v1 requirements. contents: write is the dependency-graph
# submission (403 without it); actions/checks read feed its no-all-builds
# guard; deployments + artifact-metadata are the GitHub Deployment and
# storage record its buildhost autorelease posts as part of publishing.
# All are hard failures, and a job-level block REPLACES this one.
permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: wow-look-at-my/go-toolchain@v1
        env:
          CGO_ENABLED: "0"

      # go-toolchain@v1 already hands off its build/ outputs through the org
      # cache transport on every run, so nothing extra is uploaded here. The
      # GitHub artifact this used to upload reported success and then could not
      # be downloaded -- the org's Actions artifact storage is exhausted, which
      # is why every repo here moved to the cache hand-off.

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # cache-download reads this run's hand-off listing.
      actions: read
    steps:
      - uses: actions/checkout@v4

      # go-toolchain saves TWO hand-offs per run -- the bare `go-build` and a
      # job-scoped `go-build-<job>` -- so nameless self-discovery refuses to
      # guess between them. Naming the job-scoped one is an exact key match
      # against this run and this job, with no prefix fallback that could
      # reach an earlier run's entry.
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: go-build-build-and-test
          path: build

      # go-toolchain's hand-off carries the whole build matrix under
      # per-platform names (frontend_linux_amd64, frontend_darwin_arm64, ...).
      # The old artifact upload named one file `frontend`, which is what the
      # Dockerfile COPYs, so pick the image's platform out of the matrix.
      - name: Stage the linux/amd64 binary
        run: |
          ls -la build/
          mv build/frontend_linux_amd64 build/frontend
          chmod +x build/frontend

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image
        run: docker build -t docker-frontend:smoke .

      - name: Smoke test frontend
        run: |
          printf '%s\n' '# syntax=docker-frontend:smoke' 'FROM debian:bookworm-slim' 'APT install curl' 'RUN curl --version' > Dockerfile.smoke
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.smoke --no-cache .

      - name: Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
